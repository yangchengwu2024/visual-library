name: Test read-only MCP
on:
  push:
    paths: ['scripts/**', 'tests_mcp/**', 'requirements-mcp.txt', '.github/workflows/test-mcp.yml']
  pull_request:
    paths: ['scripts/**', 'tests_mcp/**', 'requirements-mcp.txt', '.github/workflows/test-mcp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-mcp.txt
      - run: python -B -m unittest discover -s tests_mcp -v
